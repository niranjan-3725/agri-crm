{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="purchaseReturnForm()">

    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="min-w-0 flex-1">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight">Purchase
                Return (Outward)</h2>
        </div>
    </div>

    {% if error %}
    <div class="rounded-md bg-red-50 p-4 mb-6 border border-red-200">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
                        clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <h3 class="text-sm font-medium text-red-800">Error</h3>
                <div class="mt-2 text-sm text-red-700">
                    <p>{{ error }}</p>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <form method="POST" action="{% url 'create_purchase_return' %}">
        {% csrf_token %}

        <!-- Header Card -->
        <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6 mb-8">
            <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                <!-- Supplier -->
                <div class="sm:col-span-2">
                    <label for="supplier" class="block text-sm font-medium text-gray-700 mb-1">Supplier</label>
                    <div class="mt-1">
                        <select name="supplier" id="supplier" required
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                            <option value="">-- Select Supplier --</option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Date -->
                <div class="sm:col-span-2">
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                    <div class="mt-1">
                        <input type="date" name="date" id="date" value="{% now 'Y-m-d' %}" required
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                    </div>
                </div>

                <!-- Reason -->
                <div class="sm:col-span-2">
                    <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
                    <div class="mt-1">
                        <input type="text" name="reason" id="reason" placeholder="e.g. Damaged Goods" required
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                    </div>
                </div>
            </div>
        </div>

        <!-- Items Card -->
        <div class="bg-white shadow-sm rounded-lg border border-gray-200 overflow-hidden mb-8">
            <div class="min-w-full inline-block align-middle">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4 flex justify-between items-center">
                    <h3 class="text-lg font-medium leading-6 text-gray-900">Return Items</h3>
                    <button type="button" @click="addRow()"
                        class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
                        <svg class="-ml-1 mr-2 h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd" />
                        </svg>
                        Add Item
                    </button>
                </div>

                <table class="min-w-full divide-y divide-gray-300">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider pl-6">
                                Product</th>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Batch</th>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Stock</th>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Return Qty</th>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Refund Rate</th>
                            <th scope="col"
                                class="px-3 py-3.5 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Total</th>
                            <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6"><span
                                    class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <template x-for="(row, index) in rows" :key="row.id">
                            <tr>
                                <!-- Product Search -->
                                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm sm:pl-6">
                                    <div class="relative rounded-md shadow-sm">
                                        <div
                                            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                            <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd"
                                                    d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </div>
                                        <input type="text" x-model="row.productSearch"
                                            @input.debounce.500ms="searchProducts(row)" list="product-list-global"
                                            placeholder="Search product..."
                                            class="block w-full rounded-md border-gray-300 pl-10 focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                        <input type="hidden" x-model="row.productId">
                                    </div>
                                </td>

                                <!-- Batch Select -->
                                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                    <select name="batch_id[]" x-model="row.batchId" @change="updateBatchDetails(row)"
                                        :disabled="!row.productId"
                                        class="block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                        <option value="">Select Batch</option>
                                        <template x-for="batch in row.availableBatches" :key="batch.id">
                                            <option :value="batch.id" x-text="batch.batch_number"></option>
                                        </template>
                                    </select>
                                </td>

                                <!-- Stock -->
                                <td class="whitespace-nowrap px-3 py-4 text-sm font-medium">
                                    <span :class="{'text-red-600': row.stockError, 'text-gray-900': !row.stockError}"
                                        x-text="row.stockDisplay || '-'"></span>
                                </td>

                                <!-- Qty -->
                                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                    <input type="number" name="qty[]" x-model.number="row.qty"
                                        @input="calculateRow(row)" required min="1"
                                        class="block w-24 rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                </td>

                                <!-- Price -->
                                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                    <div class="relative">
                                        <div
                                            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                            <span class="text-gray-500 sm:text-sm">₹</span>
                                        </div>
                                        <input type="number" step="0.01" name="price[]" x-model.number="row.price"
                                            @input="calculateRow(row)"
                                            class="block w-32 rounded-md border-gray-300 pl-7 focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                    </div>
                                    <p class="mt-1 text-xs text-gray-500" x-show="row.costHelper"
                                        x-text="'Cost: ₹' + row.costHelper"></p>
                                </td>

                                <!-- Total -->
                                <td class="whitespace-nowrap px-3 py-4 text-sm font-bold text-gray-900">
                                    ₹<span x-text="row.total.toFixed(2)"></span>
                                </td>

                                <!-- Delete -->
                                <td class="whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
                                    <button type="button" @click="removeRow(index)"
                                        class="text-red-600 hover:text-red-900 transition-colors rounded-full p-2 hover:bg-red-50">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
                                            fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <!-- Footer Totals -->
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end items-center">
                <div class="text-right">
                    <p class="text-sm text-gray-500">Total Refund Amount</p>
                    <p class="text-2xl font-bold text-gray-900">₹<span x-text="grandTotal()"></span></p>
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-x-4">
            <a href="{% url 'returns_list' %}"
                class="rounded-md border border-gray-300 bg-white py-2 px-6 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">Cancel</a>
            <button type="submit"
                class="inline-flex justify-center rounded-md border border-transparent bg-red-600 py-2 px-6 text-sm font-bold text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">Process
                Return</button>
        </div>

    </form>

    <!-- Alpine Script & Datalist -->
    <datalist id="product-list-global">
        <template x-for="p in searchResults" :key="p.id">
            <option :value="p.name"></option>
        </template>
    </datalist>
</div>

<script>
    function purchaseReturnForm() {
        return {
            rows: [{ id: Date.now(), productSearch: '', productId: '', batchId: '', availableBatches: [], qty: 1, price: 0, total: 0, stockDisplay: '', stockError: false, costHelper: '' }],
            searchResults: [],
            addRow() {
                this.rows.push({ id: Date.now(), productSearch: '', productId: '', batchId: '', availableBatches: [], qty: 1, price: 0, total: 0, stockDisplay: '', stockError: false, costHelper: '' });
            },
            removeRow(index) { this.rows.splice(index, 1); },
            async searchProducts(row) {
                if (row.productSearch.length < 2) return;
                const response = await fetch(`{% url 'search_products' %}?format=json&q=${row.productSearch}`);
                const products = await response.json();
                this.searchResults = products;
                const match = products.find(p => p.name.toLowerCase() === row.productSearch.toLowerCase());
                if (match) { row.productId = match.id; this.fetchBatches(row); } else { row.productId = ''; row.availableBatches = []; }
            },
            async fetchBatches(row) {
                if (!row.productId) return;
                const response = await fetch(`{% url 'get_batches_for_product' %}?product_id=${row.productId}`);
                const batches = await response.json();
                row.availableBatches = batches; row.batchId = ''; row.stockDisplay = ''; row.price = 0;
            },
            updateBatchDetails(row) {
                const batch = row.availableBatches.find(b => b.id == row.batchId);
                if (batch) { row.stockDisplay = batch.quantity; row.price = batch.cost; row.costHelper = batch.cost; this.calculateRow(row); } else { row.stockDisplay = ''; row.price = 0; row.costHelper = ''; }
            },
            calculateRow(row) {
                row.stockError = row.stockDisplay !== '' && row.qty > row.stockDisplay;
                row.total = row.qty * row.price;
            },
            grandTotal() { return this.rows.reduce((sum, row) => sum + row.total, 0).toFixed(2); }
        }
    }
</script>
{% endblock %}
