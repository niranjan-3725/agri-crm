{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div x-data="purchaseReturnLogic()" class="flex flex-col xl:flex-row min-h-screen bg-[#F8F9FA]">

    <!-- LEFT: Main Form Area -->
    <main class="flex-1 min-w-0 p-6 md:p-10 lg:p-12 pb-32">
        <div class="max-w-5xl mx-auto space-y-8">

            <!-- Header -->
            <header class="flex flex-col gap-2">
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-widest">
                    <span class="bg-red-50 text-red-600 px-2 py-1 rounded">Purchase</span>
                    <span>•</span>
                    <span>Return (Outward)</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight">Purchase Return</h1>
                <p class="text-gray-500">Process return of goods to suppliers</p>
            </header>

            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-2xl" role="alert">
                <strong class="font-bold">Error!</strong>
                <span class="block sm:inline">{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'create_purchase_return' %}">
                {% csrf_token %}

                <!-- Master Fields Card -->
                <div
                    class="bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                    <!-- Supplier Select -->
                    <div>
                        <label
                            class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Supplier</label>
                        <select name="supplier" required
                            class="w-full h-14 bg-gray-50 rounded-2xl px-5 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all">
                            <option value="">-- Select Supplier --</option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Date -->
                    <div>
                        <label
                            class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Date</label>
                        <input type="date" name="date" value="{% now 'Y-m-d' %}" required
                            class="w-full h-14 bg-gray-50 rounded-2xl px-5 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all">
                    </div>

                    <!-- Reason -->
                    <div>
                        <label
                            class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Reason</label>
                        <input type="text" name="reason" placeholder="e.g. Damaged Goods" required
                            class="w-full h-14 bg-gray-50 rounded-2xl px-5 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all placeholder-gray-400">
                    </div>
                </div>

                <!-- Items Section (Card-Based) -->
                <div class="space-y-4">
                    <template x-for="(row, i) in rows" :key="row.id">
                        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm relative">
                            <!-- Remove Button -->
                            <button type="button" @click="removeRow(i)"
                                class="absolute top-4 right-4 p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors z-10">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>

                            <!-- Hidden Inputs -->
                            <input type="hidden" name="batch_id[]" :value="row.batchId">

                            <!-- Row 1: Product Search -->
                            <div class="mb-4 relative">
                                <div class="flex justify-between items-end mb-2">
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 block">Product
                                        to Return</label>
                                    <div class="flex gap-4 text-xs font-bold pr-10" x-show="row.stockDisplay">
                                        <span class="text-gray-400">Stock: <span
                                                :class="{'text-red-600': row.stockError, 'text-gray-900': !row.stockError}"
                                                x-text="row.stockDisplay || '-'"></span></span>
                                    </div>
                                </div>
                                <div class="relative group">
                                    <input type="text" x-model="row.productSearch"
                                        @input.debounce.300ms="searchProducts(row)" list="product-list-global"
                                        placeholder="Search Product..."
                                        class="w-full h-14 bg-gray-50 rounded-2xl px-5 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all placeholder-gray-400">
                                    <input type="hidden" :value="row.productId">
                                </div>
                            </div>

                            <!-- Row 2: Info Grid -->
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                                <!-- Batch -->
                                <div>
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Batch</label>
                                    <select name="batch_id[]" x-model="row.batchId" @change="updateBatchDetails(row)"
                                        :disabled="!row.productId"
                                        class="w-full h-12 bg-gray-50 rounded-xl px-4 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all disabled:bg-gray-100 disabled:text-gray-400">
                                        <option value="">Select Batch</option>
                                        <template x-for="batch in row.availableBatches" :key="batch.id">
                                            <option :value="batch.id" x-text="batch.batch_number"></option>
                                        </template>
                                    </select>
                                </div>

                                <!-- Size (Read-only, auto-populated) -->
                                <div>
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Size</label>
                                    <input type="text" x-model="row.size" readonly
                                        class="w-full h-12 bg-gray-100 text-gray-500 rounded-xl px-4 font-medium border border-transparent outline-none cursor-not-allowed">
                                </div>

                                <!-- Unit (Read-only, auto-populated) -->
                                <div>
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Unit</label>
                                    <input type="text" x-model="row.unit" readonly
                                        class="w-full h-12 bg-gray-100 text-gray-500 rounded-xl px-4 font-medium border border-transparent outline-none cursor-not-allowed">
                                </div>

                                <!-- Quantity -->
                                <div>
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Return
                                        Qty</label>
                                    <input type="number" name="qty[]" x-model.number="row.qty"
                                        @input="calculateRow(row)" min="1" :disabled="!row.batchId"
                                        class="w-full h-12 bg-gray-50 rounded-xl px-4 font-bold text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all text-center disabled:bg-gray-100 disabled:text-gray-400">
                                </div>

                                <!-- Refund Rate -->
                                <div>
                                    <label
                                        class="text-[10px] font-bold uppercase tracking-widest text-gray-400 pl-1 mb-2 block">Rate</label>
                                    <input type="number" step="0.01" name="price[]" x-model.number="row.price"
                                        @input="calculateRow(row)" :disabled="!row.batchId"
                                        class="w-full h-12 bg-gray-50 rounded-xl px-4 font-medium text-gray-900 border border-transparent hover:border-gray-200 focus:border-red-500/20 focus:bg-white outline-none transition-all text-center disabled:bg-gray-100 disabled:text-gray-400">
                                </div>
                            </div>

                            <!-- Row Total -->
                            <div class="mt-4 pt-4 border-t border-gray-50 flex justify-end">
                                <div class="text-right">
                                    <span class="text-xs text-gray-400 uppercase">Item Total</span>
                                    <div class="text-lg font-bold text-gray-900">&#8377;<span
                                            x-text="row.total.toFixed(2)"></span></div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Add Item Button -->
                    <button type="button" @click="addRow()"
                        class="w-full py-6 border-2 border-dashed border-gray-200 rounded-3xl text-gray-400 hover:text-red-600 hover:border-red-300 hover:bg-red-50/50 transition-all font-bold flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M12 4v16m8-8H4"></path>
                        </svg>
                        Add Another Item
                    </button>
                </div>

                <!-- Hidden submit -->
                <button type="submit" id="main-submit-btn" class="hidden">Submit</button>
            </form>

        </div>
    </main>

    <!-- RIGHT: Sticky Summary Sidebar -->
    <aside class="xl:w-[420px] bg-white border-l border-gray-100 z-40 relative">
        <div class="xl:fixed xl:w-[420px] h-full flex flex-col">

            <div class="p-8 pb-4 border-b border-gray-50 hidden xl:block">
                <h2 class="text-lg font-bold text-gray-900">Refund Summary</h2>
                <p class="text-sm text-gray-400 mt-1">Review before processing</p>
            </div>

            <div class="flex-1 p-8 space-y-6 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex justify-between items-center py-3 border-b border-gray-50">
                        <span class="text-gray-500">Total Items</span>
                        <span class="font-bold text-gray-900" x-text="rows.length"></span>
                    </div>
                </div>

                <div class="bg-red-50 rounded-2xl p-6 border border-red-100">
                    <div class="text-xs font-bold uppercase tracking-widest text-red-600 mb-2">Total Refund</div>
                    <div class="text-4xl font-bold text-gray-900">&#8377;<span x-text="grandTotal()"></span></div>
                </div>
            </div>

            <div class="p-8 pt-4 border-t border-gray-50">
                <button type="button" @click="document.getElementById('main-submit-btn').click()"
                    :disabled="grandTotal() <= 0"
                    class="w-full py-5 rounded-2xl font-bold text-lg text-white bg-gradient-to-r from-red-500 to-red-600 shadow-xl shadow-red-500/20 hover:shadow-red-500/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Process Return
                </button>
            </div>

        </div>
    </aside>

    <!-- Alpine Script & Datalist -->
    <datalist id="product-list-global">
        <template x-for="p in searchResults" :key="p.id">
            <option :value="p.name"></option>
        </template>
    </datalist>

</div>

<script>
    function purchaseReturnLogic() {
        return {
            rows: [],
            searchResults: [],

            init() {
                this.addRow();
            },

            addRow() {
                this.rows.push({
                    id: Date.now(),
                    productSearch: '',
                    productId: '',
                    batchId: '',
                    availableBatches: [],
                    qty: 1,
                    price: 0,
                    total: 0,
                    stockDisplay: '',
                    stockError: false,
                    size: '',
                    unit: ''
                });
            },

            removeRow(index) {
                if (this.rows.length > 1) this.rows.splice(index, 1);
            },

            async searchProducts(row) {
                if (row.productSearch.length < 2) return;
                try {
                    const response = await fetch(`{% url 'search_products' %}?format=json&q=${row.productSearch}`);
                    const products = await response.json();
                    this.searchResults = products;

                    // Auto-select if exact match
                    const match = products.find(p => p.name.toLowerCase() === row.productSearch.toLowerCase());
                    if (match) {
                        row.productId = match.id;
                        this.fetchBatches(row);
                    } else {
                        row.productId = '';
                        row.availableBatches = [];
                    }
                } catch (e) {
                    console.error("Search failed", e);
                }
            },

            async fetchBatches(row) {
                if (!row.productId) return;
                try {
                    const response = await fetch(`{% url 'get_batches_for_product' %}?product_id=${row.productId}`);
                    const batches = await response.json();
                    row.availableBatches = batches;
                    row.batchId = '';
                    row.stockDisplay = '';
                    row.price = 0;
                    row.size = '';
                    row.unit = '';
                } catch (e) {
                    console.error("Batch fetch failed", e);
                }
            },

            updateBatchDetails(row) {
                const batch = row.availableBatches.find(b => b.id == row.batchId);
                if (batch) {
                    row.stockDisplay = batch.quantity;
                    row.price = parseFloat(batch.cost) || 0;
                    row.size = batch.size || '';
                    row.unit = batch.unit || '';
                    this.calculateRow(row);
                } else {
                    row.stockDisplay = '';
                    row.price = 0;
                    row.size = '';
                    row.unit = '';
                }
            },

            calculateRow(row) {
                // Stock Validation
                if (row.stockDisplay !== '') {
                    const stock = parseFloat(row.stockDisplay);
                    row.stockError = row.qty > stock;
                }

                row.total = (row.qty || 0) * (row.price || 0);
            },

            grandTotal() {
                return this.rows.reduce((sum, row) => sum + (row.total || 0), 0).toFixed(2);
            }
        }
    }
</script>
{% endblock %}
