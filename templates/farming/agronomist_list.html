{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="flex flex-col xl:flex-row min-h-screen">

    <main class="flex-1 min-w-0 p-6 md:p-10 lg:p-12 pb-32 xl:pb-12">
        <div class="max-w-5xl mx-auto space-y-10">

            <header class="flex flex-col gap-2">
                <div class="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-widest">
                    <span class="bg-green-50 text-green-600 px-2 py-1 rounded">Farming</span>
                    <span>•</span>
                    <span>Agronomists</span>
                </div>
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight">Agronomists</h1>
                    <div class="flex gap-3 w-full md:w-auto">
                        <form method="get" action="." class="relative flex-1 md:w-72 group">
                            <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text" name="q" value="{{ request.GET.q|default:'' }}"
                                placeholder="Search name, ID, zone…"
                                class="w-full bg-white border-2 border-gray-100 focus:border-blue-500/20 rounded-xl py-3 pl-12 pr-4 font-medium text-gray-900 outline-none transition-all placeholder-gray-400"
                                hx-get="{% url 'agronomist_list' %}" hx-trigger="keyup changed delay:400ms"
                                hx-target="#agronomist-table" hx-push-url="true">
                        </form>
                        <a href="{% url 'agronomist_add' %}"
                            class="bg-gray-900 hover:bg-black text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-gray-900/20 active:scale-95 transition-all flex items-center gap-2 whitespace-nowrap">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            <span class="hidden md:inline">Add Agronomist</span>
                        </a>
                    </div>
                </div>
            </header>

            <div id="agronomist-table">
                {% include 'farming/partials/agronomist_table.html' %}
            </div>

        </div>
    </main>

    <aside class="xl:w-80 bg-white border-l border-gray-100">
        <div class="xl:fixed xl:w-80 h-full flex flex-col">
            <div class="p-8 pb-4 border-b border-gray-50 hidden xl:block">
                <h2 class="text-lg font-bold text-gray-900">Agronomist Directory</h2>
                <p class="text-sm text-gray-400 mt-1">Field staff management</p>
            </div>
            <div class="flex-1 p-8 space-y-6 overflow-y-auto">
                <div class="bg-gradient-to-br from-green-600 to-green-700 text-white rounded-[2rem] p-6 shadow-xl shadow-green-600/20 relative overflow-hidden">
                    <div class="relative z-10">
                        <div class="text-green-200 text-xs font-bold uppercase tracking-widest mb-1">Total Staff</div>
                        <div class="text-4xl font-bold tracking-tight mb-4">{{ total }}</div>
                        <div class="border-t border-white/10 pt-4">
                            <div class="text-green-200 text-xs font-bold uppercase tracking-widest mb-1">Active</div>
                            <div class="text-2xl font-bold">{{ active }}</div>
                        </div>
                    </div>
                    <div class="absolute -right-4 -top-4 w-28 h-28 bg-white/10 rounded-full blur-xl"></div>
                </div>
            </div>
        </div>
    </aside>

</div>
{% endblock %}
